<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'">
<title>额度气泡</title><link rel="stylesheet" href="metric.css"><script src="metric.js" defer></script></head>
<body>
<main id="bubble" class="bubble" data-status="loading" tabindex="0" aria-label="额度气泡">
  <span class="dot" aria-hidden="true"></span>
  <div class="copy" aria-live="polite"><div class="line"><span id="source">Codex</span><span class="divider" aria-hidden="true"></span><strong id="amount">正在读取…</strong></div><div id="meta">稍后显示剩余信息</div></div>
  <div class="actions"><button id="more" title="刷新、切换来源和设置" aria-label="更多额度选项"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="4" cy="10" r="1.3"/><circle cx="10" cy="10" r="1.3"/><circle cx="16" cy="10" r="1.3"/></svg></button><button id="close" title="关闭额度气泡" aria-label="关闭额度气泡"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m6 6 8 8M14 6l-8 8"/></svg></button></div>
</main></body></html>
